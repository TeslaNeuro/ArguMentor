<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-label="ArguMentor debate room">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1210"/>
      <stop offset="100%" stop-color="#121c17"/>
    </linearGradient>
    <radialGradient id="glow2" cx="80%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#3ecf8e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3ecf8e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="880" height="560" rx="18" fill="url(#bg2)"/>
  <rect width="880" height="560" rx="18" fill="url(#glow2)"/>
  <text x="48" y="56" fill="#8aa394" font-family="Helvetica, sans-serif" font-size="12" letter-spacing="3">OPENING · ROUND 1 / 3 · INTERMEDIATE</text>
  <text x="48" y="98" fill="#d6e8dc" font-family="Georgia, serif" font-size="26">Ban facial recognition in public spaces</text>
  <rect x="48" y="124" width="784" height="168" rx="14" fill="#16201bcc" stroke="#2a3d33"/>
  <text x="72" y="158" fill="#3ecf8e" font-family="Helvetica, sans-serif" font-size="11" letter-spacing="2">OPPONENT · STREAMING</text>
  <text x="72" y="196" fill="#d6e8dc" font-family="Georgia, serif" font-size="16">Define the metric of success you are optimizing for,</text>
  <text x="72" y="224" fill="#d6e8dc" font-family="Georgia, serif" font-size="16">then show why your mechanism outperforms the strongest</text>
  <text x="72" y="252" fill="#d6e8dc" font-family="Georgia, serif" font-size="16">alternative — not a strawman.</text>
  <rect x="48" y="312" width="784" height="140" rx="14" fill="#0f1713" stroke="#2a3d33"/>
  <text x="72" y="348" fill="#8aa394" font-family="Helvetica, sans-serif" font-size="12">YOUR TURN</text>
  <text x="72" y="386" fill="#8aa394" font-family="Georgia, serif" font-size="16">Advance the case, rebut, and press their weakest warrant…</text>
  <rect x="48" y="472" width="176" height="44" rx="8" fill="#3ecf8e"/>
  <text x="68" y="500" fill="#062016" font-family="Helvetica, sans-serif" font-size="14" font-weight="700">Submit argument</text>
  <rect x="236" y="472" width="132" height="44" rx="8" fill="none" stroke="#2a3d33"/>
  <text x="258" y="500" fill="#d6e8dc" font-family="Helvetica, sans-serif" font-size="14">End &amp; judge</text>
</svg>
